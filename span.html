<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Image Card Hover</title>
  <style>
    body {
      background: #121212;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .card {
      width: 500px;
      height: 500px;
      border-radius: 1px;
      background: #212121;
      display: flex;
      gap: 5px;
      padding: .4em;
    }

    .card p {
      height: 100%;
      flex: 1;
      overflow: hidden;
      cursor: pointer;
      border-radius: 2px;
      transition: all .5s;
      background: #212121;
      border: 1px solid #ff5a91;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .card p:hover {
      flex: 4;
    }

    .card p span {
      min-width: 14em;
      padding: .5em;
      text-align: center;
      transform: rotate(-90deg);
      transition: all .5s;
      text-transform: uppercase;
      color: #ff568e;
      letter-spacing: .1em;
      position: absolute;
      z-index: 2;
    }

    .card p:hover span {
      transform: rotate(0);
    }

    .card p img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: absolute;
      z-index: 1;
      opacity: 0.6;
      transition: opacity 0.5s;
    }

    .card p:hover img {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="card">
    <p>
      <img src="https://images.unsplash.com/photo-1606788075761-8b2b3f3f0e3c?auto=format&fit=crop&w=400&q=80" alt="Biryani" />
      <span>Biryani</span>
    </p>
    <p>
      <img src="https://images.unsplash.com/photo-1627308595229-7830a5c91f9f?auto=format&fit=crop&w=400&q=80" alt="Polao" />
      <span>Polao</span>
    </p>
    <p>
      <img src="https://images.unsplash.com/photo-1600891964599-f61ba0e24092?auto=format&fit=crop&w=400&q=80" alt="Burger" />
      <span>Burger</span>
    </p>
    <p>
      <img src="https://images.unsplash.com/photo-1604908177522-402b3a7c0b2e?auto=format&fit=crop&w=400&q=80" alt="Pizza" />
      <span>Pizza</span>
    </p>
    <p>
      <img src="https://images.unsplash.com/photo-1613145993481-2f3b3f3e3c3c?auto=format&fit=crop&w=400&q=80" alt="Sushi" />
      <span>Sushi</span>
    </p>
  </div>

</body>
</html>
